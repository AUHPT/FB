<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Studio · The Mangroves Abu Dhabi</title>
<style>
/*FONTS*/
/*DIYAFONTS*//*TAYOFONTS*/
@font-face{font-family:'GPPLocal';font-weight:400;src:local('GaramondPremrPro'),local('Garamond Premier Pro');}
@font-face{font-family:'GPPLocal';font-weight:500;src:local('GaramondPremrPro-Med'),local('Garamond Premier Pro Medium');}
@font-face{font-family:'GPPLocal';font-weight:600;src:local('GaramondPremrPro-Smbd'),local('Garamond Premier Pro Semibold');}
@font-face{font-family:'GPPLocal';font-weight:400;font-style:italic;src:local('GaramondPremrPro-It'),local('Garamond Premier Pro Italic');}
@font-face{font-family:'AktivLocal';font-weight:600;src:local('AktivGroteskEx-SemiBold'),local('Aktiv Grotesk Ex SemiBold');}
@font-face{font-family:'AktivLocal';font-weight:700;src:local('AktivGroteskEx-Bold'),local('Aktiv Grotesk Ex Bold');}
@font-face{font-family:'AktivLocal';font-weight:800;src:local('AktivGroteskEx-XBold'),local('Aktiv Grotesk Ex XBold');}

:root{
  --bg:#ECE6DA; --panel:#FFFFFF; --line:#DCD3C2; --line2:#E7E0D3; --txt:#1E2B27; --mut:#68706B; --mut2:#9A9C94;
  --acc:#324F47; --acc2:#3F6359; --accbg:#E4ECE8; --danger:#C2372B; --ok:#2F8F4E;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .dot{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13.5px;min-width:0;overflow:hidden}
.crumbs a{color:var(--mut);text-decoration:none;padding:4px 8px;border-radius:8px;transition:background .2s}
.crumbs a:hover{background:#E9E3D7;color:var(--txt)}
.crumbs .cur{color:var(--txt);font-weight:600;padding:4px 8px;white-space:nowrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--txt);font-weight:500;font-size:13.5px;transition:transform .15s var(--ease),background .2s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:hover{background:#F7F4EE}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(50,79,71,.25)}
.btn.pri:hover{background:var(--acc2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#E9E3D7}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.sm.icon{width:28px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.loading{pointer-events:none;opacity:.85}
.btn.loading .lbl{opacity:.0}
.btn .spin{display:none;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;position:absolute}
.btn{position:relative}
.btn.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.save-state{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;transition:background .3s}
.save-state.dirty i{background:#E0A100}
.save-state.bad i{background:#D9822B}
.vlist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;background:#FDFCF9}
.vrow b{display:block;font-size:13.5px;font-weight:600}.vrow small{color:var(--mut);font-size:12px}
.modal .inp{height:38px;padding:8px 11px}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- screens ---------- */
.screen{animation:fadeUp .35s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:1060px;margin:0 auto;padding:44px 24px 80px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--sh);padding:22px;border:1px solid rgba(0,0,0,.03);transition:transform .25s var(--ease),box-shadow .25s;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 14px 34px rgba(0,0,0,.09)}
.card:active{transform:scale(.985)}
.card .logo{height:96px;display:flex;align-items:center;justify-content:center;margin:6px 0 16px;color:var(--acc)}
.card .logo svg{height:100%;width:auto}
.card h3{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
.card p{margin:0;color:var(--mut);font-size:13px;line-height:1.45}
.card .chip{display:inline-block;margin-top:12px;font-size:11.5px;font-weight:600;color:var(--acc);background:var(--accbg);padding:4px 9px;border-radius:20px}
.card.disabled{cursor:default;opacity:.7;background:transparent;border:1.5px dashed #CDC3B0;box-shadow:none}
.card.disabled:hover{transform:none}
.mcard{display:flex;gap:16px;align-items:flex-start}
.mthumb{width:62px;flex:none;aspect-ratio:var(--ar);background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.06);position:relative;overflow:hidden}
.mthumb:after{content:"";position:absolute;inset:12% 14%;border:1.2px solid var(--c);opacity:.8}
.mthumb:before{content:"";position:absolute;left:24%;right:24%;top:26%;height:38%;background:repeating-linear-gradient(var(--c) 0 1px,transparent 1px 6px);opacity:.35}
.meta{font-size:12px;color:var(--mut2);margin-top:10px}

/* ---------- editor ---------- */
.ed{display:grid;grid-template-columns:minmax(420px,520px) 1fr;height:calc(100vh - 58px)}
.left{background:#FAF8F3;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:12px 14px 0;}
.tab{flex:1;height:34px;border-radius:9px;border:0;background:transparent;color:var(--mut);font-weight:600;font-size:13px;transition:background .2s,color .2s}
.tab.on{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabbar{margin:0 14px;padding:3px;background:#E9E3D7;border-radius:11px;display:flex;gap:2px;margin-top:12px}
.scroll{overflow:auto;padding:14px 14px 120px;flex:1;scroll-behavior:smooth}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:box-shadow .25s,border-color .25s}
.sec.drop{border-color:var(--acc)}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;cursor:pointer;user-select:none}
.sec-h .chev{transition:transform .25s var(--ease);color:var(--mut2)}
.sec.open .sec-h .chev{transform:rotate(90deg)}
.sec-h .t{font-weight:650;font-size:13.5px;letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h .t small{font-weight:500;color:var(--mut2);margin-left:6px;letter-spacing:0}
.sec-h .acts{display:flex;gap:2px;opacity:.0;transition:opacity .2s}
.sec-h:hover .acts,.sec.open .sec-h .acts{opacity:1}
.sec-b{display:none;padding:2px 12px 12px;border-top:1px solid var(--line2)}
.sec.open .sec-b{display:block;animation:fadeUp .25s var(--ease)}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:var(--accbg);padding:3px 7px;border-radius:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:13.5px;outline:none;transition:border-color .2s,box-shadow .2s;resize:vertical;min-height:34px;line-height:1.35}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(50,79,71,.14)}
.inp[dir=rtl]{font-family:'Parastoo V',-apple-system,sans-serif;font-size:17.5px}
textarea.inp{min-height:34px;field-sizing:content}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.tgl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none}
.tgl input{display:none}
.tgl .sw{width:32px;height:19px;border-radius:12px;background:#D2C9B8;position:relative;transition:background .2s;flex:none}
.tgl .sw:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.tgl input:checked + .sw{background:var(--acc)}
.tgl input:checked + .sw:after{transform:translateX(13px)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.items{display:flex;flex-direction:column;gap:8px}
.it{border:1px solid var(--line2);background:#FDFCF9;border-radius:11px;padding:8px 8px 8px 6px;display:grid;grid-template-columns:18px 1fr;gap:6px;position:relative;transition:border-color .2s,box-shadow .2s,background .3s,transform .2s}
.it:focus-within{border-color:#AFC1BA;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.it.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%,40%{background:#D7E3DE;border-color:var(--acc)}100%{}}
.it.sub{background:#F3EFE6}
.it.dragging{opacity:.4}
.it.dropb{box-shadow:0 -2px 0 var(--acc)}
.it.dropa{box-shadow:0 2px 0 var(--acc)}
.grip{cursor:grab;color:#BDB4A3;display:flex;align-items:flex-start;justify-content:center;padding-top:7px}
.grip:active{cursor:grabbing}
.it .flds{display:grid;grid-template-columns:1fr 1fr 74px;gap:6px}
.it .flds .w2{grid-column:span 2}
.it .flds .w3{grid-column:1/-1}
.it .inp{resize:none;font-size:13px;padding:6px 8px;min-height:31px;border-radius:8px}
.it .inp[dir=rtl]{font-size:17px}
.it .tools{grid-column:1/-1;display:flex;gap:4px;align-items:center;margin-top:2px;padding-left:24px}
.it .tools .btn{height:24px;font-size:11.5px;padding:0 8px;color:var(--mut)}
.it .tools .tgl{font-size:11.5px}
.it .tools .tgl .sw{width:26px;height:16px}
.it .tools .tgl .sw:after{width:12px;height:12px}
.it .tools .tgl input:checked + .sw:after{transform:translateX(10px)}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow .btn{flex:1;justify-content:center;border-style:dashed;color:var(--mut);background:transparent}
.addrow .btn:hover{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
.colbox{border:1px dashed var(--line);border-radius:12px;padding:8px;margin-top:10px}
.colbox h4{margin:2px 2px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.note{font-size:12px;color:var(--mut);background:#F3EFE6;border-radius:10px;padding:10px 12px;line-height:1.5;margin:4px 0 12px}
.grp{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.grp h3{margin:0 0 4px;font-size:13px;letter-spacing:.01em}

/* ---------- preview ---------- */
.right{display:flex;flex-direction:column;min-width:0;min-height:0;background:#E3DBCB}
.pbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #D6CDBB;background:#EBE5D9}
.pbar .pi{font-size:12.5px;color:var(--mut)}
.pview{flex:1;overflow:auto;padding:28px 24px 80px;display:flex;flex-direction:column;align-items:center;gap:26px;scroll-behavior:smooth}
.pwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.plabel{font-size:11.5px;color:var(--mut);font-weight:500;letter-spacing:.02em}
.pshadow{box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.12);background:#fff}
.warn{background:#FFF4E5;color:#8a5300;border:1px solid #f3d7a8;border-radius:10px;padding:8px 12px;font-size:12.5px;max-width:640px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1c1c1e;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;transition:all .35s var(--ease);z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.menu-pop{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:6px;min-width:230px;z-index:30;animation:fadeUp .2s var(--ease)}
.menu-pop button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left}
.menu-pop button:hover{background:#F3EFE6}
.menu-pop hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:50;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:#fff;border-radius:18px;padding:22px;width:min(520px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.3);animation:fadeUp .3s var(--ease);max-height:88vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:18px}
.modal p{color:var(--mut);margin:0 0 14px;line-height:1.5;font-size:13.5px}
.modal ol{padding-left:18px;color:var(--txt);line-height:1.7;font-size:13.5px;margin:0 0 16px}
.fontslot{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:13px}
.fontslot b{flex:1;font-weight:600}
.fontslot .st{color:var(--mut);font-size:12px}

/* ---------- The Mangroves Abu Dhabi, LXR — brand top bar (Pantone 554 #324F47 / Warm Grey 1 #ECE6DA) ---------- */
.top{background:#324F47 !important;color:#ECE6DA;border-bottom:0 !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
.top .brand .dot{background:#ECE6DA;color:#324F47}
.top .crumbs,.top .crumbs a{color:rgba(236,230,218,.72)}
.top .crumbs a:hover{background:rgba(255,255,255,.1);color:#fff}
.top .crumbs .cur{color:#fff}
.top .btn.ghost{color:#ECE6DA}
.top .btn.ghost:hover{background:rgba(255,255,255,.12)}
.top .btn.pri{background:#ECE6DA;border-color:#ECE6DA;color:#324F47;box-shadow:none}
.top .btn.pri:hover{background:#fff}
.top .btn .spin{border-color:rgba(50,79,71,.3);border-top-color:#324F47}
.top .save-state{color:rgba(236,230,218,.8)}
.top .menu-pop{color:var(--txt)}
.top .menu-pop .btn.ghost,.top .menu-pop button{color:var(--txt)}

/* ================= MENU PAGE RENDERING (all units in pt) ================= */
.pg{position:relative;background:#fff;overflow:hidden;color:var(--ink);font-kerning:normal;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased}
.pg *{box-sizing:content-box}
.pg .a{position:absolute}
.pg .fr{font-family:'Fraunces V',Georgia,serif;font-weight:300;font-size:11pt;font-variation-settings:'opsz' 144}
.pg .fr8{font-size:8pt}
.pg .fr9,.pg .psm{font-size:9pt}
.pg .fr10{font-size:10pt}
.pg span{line-height:0}
.pg .ak{font-family:'AktivUser','AktivLocal','Archivo V',Arial,sans-serif;font-weight:600;font-stretch:115%;font-size:12pt}
.pg .ak .ar,.pg .ar.sb{font-weight:600}
.pg .ak .ar{font-size:1.1em}
.pg .fr .ar{font-size:1.1818em}
.pg .xb{font-weight:800}
.pg .bd{font-weight:700}
.pg .t200{letter-spacing:.2em}
.pg .t150{letter-spacing:.15em}
.pg .t100{letter-spacing:.1em}
.pg .caps{text-transform:uppercase}
.pg .ar{font-family:'Parastoo V',sans-serif;letter-spacing:0;font-variation-settings:normal}
.pg .rtl{direction:rtl;unicode-bidi:isolate}
.pg .gr{font-family:'GPPUser','GPPLocal','EB Garamond V',Garamond,serif;font-weight:400}
.pg .gr .b,.pg .gr.b{font-weight:600}
.pg .gr.m{font-weight:500}
.pg .gr.i{font-style:italic}
.pg .aa{font-family:'AdobeArabicUser','Adobe Arabic','AdobeArabicE','GPPUser','GPPLocal','EB Garamond V',serif;font-weight:400;letter-spacing:0}
.pg .aa .b,.pg .aa.b{font-weight:700}
.pg .aa.i{font-style:italic}
.pg .diecut-fill{fill:rgba(70,55,40,.075)}
.pg .al{font-family:'AlvUser','Alverata','Spectral T',Georgia,serif;font-weight:400;letter-spacing:0}
.pg .al.m,.pg .al .m{font-weight:500}
.pg .al.b,.pg .al .b{font-weight:700}
.pg .al.i,.pg .al .i{font-style:italic}
.pg .gc{font-family:'GCAUser','Greycliff Arabic CF','Readex T','Noto Sans JP',sans-serif;font-weight:400;letter-spacing:0}
.pg .gc.b,.pg .gc .b{font-weight:700}
@media print{.pg .fold{display:none}}
@media print{.pg .diecut-fill{display:none}}
.pg .pa{font-family:'Parastoo V',sans-serif;font-size:9pt;line-height:9pt;letter-spacing:-.01em}
.pg .c{text-align:center}
.pg .r{text-align:right}
.pg .l{text-align:left}
.pg .nw{white-space:nowrap}
.pg .pre{white-space:pre-wrap}
.pg .blk{position:absolute}
.pg .rule{position:absolute;height:0;border-top-style:solid;border-top-color:currentColor}
.pg .prc{position:absolute;right:0;top:0;text-align:right;white-space:pre}
.pg .hl{outline:1.5pt solid rgba(115,105,34,.0);outline-offset:2pt;transition:outline-color .25s;cursor:pointer}
.pview .pg .hl:hover{outline-color:rgba(115,105,34,.28)}
.pview .pg .hl.sel{outline-color:rgba(115,105,34,.6)}
.pg .ovf{background:repeating-linear-gradient(45deg,rgba(220,60,40,.10) 0 4pt,transparent 4pt 8pt)}

#measure{position:absolute;left:-20000px;top:0;visibility:hidden;width:2000pt}
#printRoot{display:none}
@media print{
  html,body{background:#fff !important;height:auto}
  body>*:not(#printRoot){display:none !important}
  #printRoot{display:block !important}
  #printRoot .pg{break-after:page;page-break-after:always}
  #printRoot .pg:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
}
@media (max-width:900px){.ed{grid-template-columns:1fr;height:auto}.right{min-height:80vh}}
</style>
<style id="pageSizeCss"></style>
<style id="userFontsCss"></style>
</head>
<body>
<header class="top" id="top">
  <div class="brand"><div class="dot">M</div><span>Menu Studio</span></div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="sp"></div>
  <div id="topActions" style="display:flex;gap:8px;align-items:center"></div>
</header>
<main id="app"></main>
<div id="measure" class="pg"></div>
<div id="printRoot"></div>
<div class="toast" id="toast"></div>
